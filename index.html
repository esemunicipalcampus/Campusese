<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocolos de Seguridad del Paciente | ESE Municipal de Villavicencio × Unillanos</title>
<meta name="description" content="Capacitación virtual en Código Azul, RCP, carro de paro, ronda de seguridad y entrega de turno para el personal de la ESE Municipal de Villavicencio.">
<link rel="icon" href="assets/logos/eselogo.jpg">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

<header class="encabezado" id="encabezado"></header>

<main class="envoltura">

  <!-- ===================== PORTADA ===================== -->
  <section class="portada">
    <div class="portada-doble">
      <img class="logo-ese" src="assets/logos/eselogo.jpg" alt="Logo ESE Municipal de Villavicencio">
      <div class="sep" aria-hidden="true"></div>
      <img class="logo-unillanos" src="assets/logos/Logo_unillanos1.png" alt="Logo Universidad de los Llanos">
    </div>

    <h1>Protocolos de Seguridad del Paciente</h1>
    <p class="subtitulo" id="subtituloPortada"></p>

    <div class="etiquetas" id="etiquetasPortada"></div>

    <div class="datos-curso" id="datosCurso"></div>
  </section>

  <!-- ===================== ACCESO / REGISTRO ===================== -->
  <section class="acceso" id="acceso"></section>

</main>

<footer class="no-imprimir" style="text-align:center;padding:1.5rem 1rem 2.5rem;color:var(--texto-suave);font-size:.82rem;border-top:1px solid var(--borde)">
  <strong>ESE Municipal de Villavicencio</strong> · Empresa Social del Estado del Municipio de Villavicencio<br>
  Universidad de los Llanos · Ruralito Unillanos
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/preguntas.js"></script>
<script src="assets/js/contenido.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Portada + acceso con Google + formulario de registro
   ------------------------------------------------------------------------- */
(function () {
  "use strict";

  const C = window.CONFIG;
  const A = window.App;

  /* ---------- textos de portada ---------- */
  document.getElementById("subtituloPortada").textContent = C.programa.subtitulo;

  document.getElementById("etiquetasPortada").innerHTML = [
    C.entidadSalud.sigla,
    C.entidadAcademica.sigla,
    ...(C.sedes || []),
    "Reconocimiento verificable",
  ].map(t => `<span class="etiqueta">${A.esc(t)}</span>`).join("");

  const prots = A.protocolos();
  const nTemas = window.TEMAS ? window.TEMAS.length : 0;
  const nModulos = window.CURSO ? window.CURSO.modulos.length : 0;
  const nPreguntas = window.BancoPreguntas ? window.BancoPreguntas.total() : 0;
  const horasTotal = prots.reduce((s, p) => s + Number(p.horas || 0), 0);

  document.getElementById("datosCurso").innerHTML = [
    [prots.length, "Protocolos"],
    [nModulos, "Módulos de estudio"],
    [nTemas, "Temas de evaluación"],
    [nPreguntas, "Preguntas"],
    [horasTotal + " h", "Duración total"],
    [C.programa.notaAprobacion + "%", "Nota de aprobación"],
  ].map(([v, t]) => `<div class="dato"><strong>${A.esc(v)}</strong><span>${A.esc(t)}</span></div>`).join("");

  /* ---------- ficha mínima: sede y cargo ----------
     El nombre y el correo YA VINIERON de Google: no se vuelven a pedir.
     Solo se elige la sede y el cargo, y se guardan para siempre. */

  function pintarSelectorPerfil(correo) {
    const previo = A.leerRegistro(correo) || {};
    const sedes = C.sedes || [];
    const cargos = C.cargos || [];

    return `
      <form id="formPerfil" novalidate>
        <div class="grilla-campos">
          <div class="campo medio">
            <label for="f_sede">Sede o punto de atención *</label>
            <select id="f_sede" name="sede">
              <option value="">Selecciona…</option>
              ${sedes.map(s => `<option value="${A.esc(s)}" ${previo.sede === s ? "selected" : ""}>${A.esc(s)}</option>`).join("")}
            </select>
            <div class="ayuda">Se imprime en tu reconocimiento.</div>
          </div>
          <div class="campo medio">
            <label for="f_cargo">Cargo *</label>
            <select id="f_cargo" name="cargo">
              <option value="">Selecciona…</option>
              ${cargos.map(c => `<option value="${A.esc(c)}" ${previo.cargo === c ? "selected" : ""}>${A.esc(c)}</option>`).join("")}
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-bloque">Guardar y continuar</button>
      </form>`;
  }

  function pintarAcceso() {
    const usuario = A.Sesion.leer();
    const cont = document.getElementById("acceso");

    if (!usuario) {
      cont.innerHTML = `
        <div class="tarjeta acceso-caja">
          <h2>Ingreso a la capacitación</h2>
          <p class="texto-suave">
            El acceso es exclusivamente con tu cuenta de Google. De ahí se toman
            tu nombre y tu correo: no vas a llenar formularios cada vez que entres.
          </p>
          <div class="g-boton" id="zonaBotonGoogle"></div>
          <div class="pasos">
            <li>Ingresa con tu cuenta de Google (una sola vez).</li>
            <li>Elige tu sede y tu cargo (una sola vez).</li>
            <li>Estudia y evalúa los 4 protocolos por separado.</li>
            <li>Descarga el reconocimiento de cada protocolo que apruebes.</li>
          </div>
        </div>`;
      A.Sesion.montarBoton(document.getElementById("zonaBotonGoogle"), () => pintarAcceso());
      return;
    }

    /* La ficha se crea sola al entrar con Google. */
    A.registrarDesdeGoogle(usuario);
    const completo = A.perfilCompleto(usuario.correo);
    const ficha = A.leerRegistro(usuario.correo) || {};

    cont.innerHTML = `
      <div class="tarjeta">
        <div class="caja-usuario">
          ${usuario.foto ? `<img src="${A.esc(usuario.foto)}" alt="" referrerpolicy="no-referrer">` : ""}
          <div>
            <strong>Sesión iniciada como ${A.esc(usuario.nombre)}</strong>
            <span>${A.esc(usuario.correo)}${usuario.emailVerified === false ? " · correo no verificado" : ""}</span>
          </div>
        </div>

        ${completo
          ? `<h2 style="margin-top:1.3rem">Tu ficha</h2>
             <div class="info-certificado" style="text-align:left">
               <div class="info-cert"><span>Nombre</span><strong>${A.esc(ficha.nombre || usuario.nombre)}</strong></div>
               <div class="info-cert"><span>Correo</span><strong>${A.esc(usuario.correo)}</strong></div>
               <div class="info-cert"><span>Sede</span><strong>${A.esc(ficha.sede || "—")}</strong></div>
               <div class="info-cert"><span>Cargo</span><strong>${A.esc(ficha.cargo || "—")}</strong></div>
             </div>
             <p class="texto-suave texto-peq" style="margin-top:.8rem">
               Tus datos vienen de Google y ya quedaron guardados. Solo se muestran;
               no se vuelven a pedir.
             </p>`
          : `<h2 style="margin-top:1.3rem">Elige tu sede y tu cargo</h2>
             <p class="texto-suave texto-peq">
               Es lo único que se te pregunta, y se guarda una sola vez para que
               aparezca en tu reconocimiento.
             </p>
             ${pintarSelectorPerfil(usuario.correo)}`}

        <div class="acciones-resultado">
          <a href="protocolos.html" class="btn btn-azul">Ir a los protocolos</a>
          ${completo ? "" : '<a href="#" class="btn btn-borde" id="btnEditarPerfil">Cambiar sede o cargo</a>'}
        </div>
      </div>`;

    const editar = document.getElementById("btnEditarPerfil");
    if (editar) {
      editar.addEventListener("click", (ev) => { ev.preventDefault(); pintarAcceso(); });
    }

    const form = document.getElementById("formPerfil");
    if (form) {
      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const sede = document.getElementById("f_sede").value.trim();
        const cargo = document.getElementById("f_cargo").value.trim();
        if (!sede || !cargo) {
          A.aviso("Selecciona tu sede y tu cargo para continuar.", "error");
          return;
        }
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;

        const datos = { sede: sede, cargo: cargo };
        A.guardarRegistro(usuario.correo, datos);
        const remoto = await A.Remoto.registrarParticipante(
          Object.assign({ correo: usuario.correo, nombre: usuario.nombre }, datos)
        );

        btn.disabled = false;
        if (remoto && remoto.ok === false && remoto.motivo !== "deshabilitado") {
          A.aviso("Se guardó en este navegador, pero no se pudo enviar al registro central. "
            + "Motivo: " + (remoto.motivo || remoto.bruto || "desconocido"), "error", 8000);
          return;
        }

        A.aviso("Ficha guardada. Ya puedes iniciar los protocolos.", "ok");
        setTimeout(() => { location.href = "protocolos.html"; }, 900);
      });
    }
  }

  pintarAcceso();
})();
</script>
</body>
</html>

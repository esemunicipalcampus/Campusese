<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo · ESE Municipal × Unillanos</title>
<link rel="icon" href="assets/logos/eselogo.jpg">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

<header class="encabezado" id="encabezado"></header>

<main class="envoltura">
  <div id="contenidoModulo">Cargando módulo…</div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/contenido.js"></script>
<script src="assets/js/preguntas.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  const A = window.App;
  const U = A.exigirRegistro();
  if (!U) return;

  const C = window.CONFIG;
  const cont = document.getElementById("contenidoModulo");

  const params = new URLSearchParams(location.search);
  const n = parseInt(params.get("n") || "1", 10);
  const mod = window.ContenidoCurso.porNumero(n);

  if (!mod) {
    cont.innerHTML = '<div class="tarjeta"><div class="vacio"><span class="icono">🔍</span>Módulo no encontrado. <a href="protocolos.html">Volver a los protocolos</a></div></div>';
    return;
  }

  /* ---- protocolo al que pertenece este módulo ---- */
  const protocoloModulo = A.protocolo(mod.protocolo || params.get("p") || "");
  if (protocoloModulo) sessionStorage.setItem("ese_protocolo", protocoloModulo.id);

  document.title = `Módulo ${mod.numero} · ${mod.titulo} | ESE Municipal × Unillanos`;

  /* ---- navegación anterior / siguiente dentro del mismo protocolo ---- */
  const todos = (window.CURSO.modulos || [])
    .filter(m => !protocoloModulo || (protocoloModulo.modulos || []).includes(m.numero))
    .slice()
    .sort((a, b) => a.numero - b.numero);
  const idx = todos.findIndex(m => m.numero === mod.numero);
  const anterior = idx > 0 ? todos[idx - 1] : null;
  const siguiente = idx < todos.length - 1 ? todos[idx + 1] : null;
  const sufijoP = protocoloModulo ? "&p=" + encodeURIComponent(protocoloModulo.id) : "";

  /* ---- render de secciones ---- */
  function avisoHtml(a) {
    if (!a) return "";
    const iconos = { clave: "🔑", dato: "📌", alerta: "⚠️", excepcion: "⚡" };
    return `<div class="aviso-${a.tipo}">
      <strong>${iconos[a.tipo] || "•"} ${A.esc(a.titulo)}</strong>${A.esc(a.texto)}
    </div>`;
  }

  function tablaHtml(t) {
    if (!t) return "";
    return `<div class="tabla-envoltura"><table class="datos">
      <thead><tr>${t.columnas.map(c => `<th>${A.esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${t.filas.map(f => `<tr>${f.map(c => `<td>${A.esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  function listaHtml(items) {
    return `<ul>${items.map(i => `<li>${A.esc(i)}</li>`).join("")}</ul>`;
  }

  function columnasHtml(cols) {
    return `<div class="columnas">${cols.map(c => `
      <div class="columna-caja">
        <h4>${A.esc(c.titulo)}</h4>
        ${listaHtml(c.items)}
      </div>`).join("")}</div>`;
  }

  const seccionesHtml = mod.secciones.map((s, i) => {
    let h = `<section class="contenido-seccion" id="sec_${i}" data-seccion="${i}">`;
    // Algunas secciones solo llevan cita o nota: no se dibuja un título vacío.
    h += `<div class="sec-contador">Sección ${i + 1} de ${mod.secciones.length}</div>`;
    if (s.titulo) h += `<h2>${A.esc(s.titulo)}</h2>`;
    if (s.subtituloRelacion) h += `<h3>${A.esc(s.subtituloRelacion)}</h3>`;
    if (s.cita) h += `<div class="cita">${A.esc(s.cita)}</div>`;
    if (s.parrafos) h += s.parrafos.map(p => `<p>${A.esc(p)}</p>`).join("");
    if (s.lista) h += listaHtml(s.lista);
    h += tablaHtml(s.tabla);
    if (s.columnas) h += columnasHtml(s.columnas);
    h += avisoHtml(s.aviso);
    if (s.nota) h += `<div class="nota">${A.esc(s.nota)}</div>`;
    h += `</section>`;
    return h;
  }).join("");

  /* ---- tema y procedimiento asociado ---- */
  const tema = window.BancoPreguntas ? window.TEMAS.find(t => t.id === mod.temaId) : null;
  const totalProtocolo = A.totalPreguntasProtocolo(protocoloModulo ? protocoloModulo.id : "");

  cont.innerHTML = `
    <section class="leedor-cabecera">
      ${protocoloModulo ? `
      <a class="miga" href="protocolos.html">← Protocolos</a>
      <div class="pt-barra" style="--color-protocolo:${protocoloModulo.color}">
        ${protocoloModulo.icono} Protocolo ${protocoloModulo.numero}: ${A.esc(protocoloModulo.nombre)}
        ${protocoloModulo.pdf
          ? `<a class="pt-pdf-inline" href="${A.esc(protocoloModulo.pdf)}" target="_blank" rel="noopener">📄 Ver el procedimiento (PDF) — si quieres consultarlo</a>`
          : ""}
      </div>` : ""}
      <div class="fila-top">
        <span class="etiqueta">Módulo ${mod.numero} de ${window.CURSO.modulos.length}</span>
        ${mod.icono ? `<span style="font-size:1.4rem">${A.esc(mod.icono)}</span>` : ""}
      </div>
      <h1>${A.esc(mod.titulo)}</h1>
      ${mod.subtitulo ? `<p class="texto-suave" style="margin:0">${A.esc(mod.subtitulo)}</p>` : ""}
      ${mod.fuente ? `<p class="fuente">Fuente: ${A.esc(mod.fuente)}</p>` : ""}
      <div class="caja-secciones" id="cajaSecciones"></div>
    </section>

    <div class="tarjeta">
      ${seccionesHtml}

      ${tema ? `
      <div class="aviso aviso-clave mt-2">
        <strong>Este módulo se evalúa en el tema "${A.esc(tema.titulo)}"</strong>
        En la evaluación de este protocolo encontrarás ${totalProtocolo} preguntas que cubren este contenido.
      </div>` : ""}

      <div class="navegacion-modulos">
        ${anterior
          ? `<a class="btn btn-borde" href="modulo.html?n=${anterior.numero}${sufijoP}">← ${A.esc(anterior.titulo)}</a>`
          : `<a class="btn btn-borde" href="protocolos.html">← Volver a los protocolos</a>`}
        ${siguiente
          ? `<a class="btn btn-borde" href="modulo.html?n=${siguiente.numero}${sufijoP}">${A.esc(siguiente.titulo)} →</a>`
          : ""}
      </div>
    </div>

    <div class="acciones-resultado pie-modulo" id="pieModulo"></div>`;

  /* ------------------------------------------------------------------
     Lectura por secciones: solo se muestra la siguiente sección cuando
     la anterior quedó marcada como realizada. Así no se puede saltar
     contenido, y la evaluación queda bloqueada hasta terminar el módulo.
     ------------------------------------------------------------------ */
  const totalSecciones = mod.secciones.length;
  const hechas = new Set(A.seccionesHechas(U.correo, mod.numero));

  /* Cronómetro: cuenta el tiempo real de estudio de este módulo. */
  A.iniciarCronometro(U.correo, mod.numero);

  const evalLink = document.getElementById("btnIrEvaluacion");
  if (evalLink && !A.evaluacionHabilitada(U.correo, protocoloModulo.id)) {
    evalLink.setAttribute("aria-disabled", "true");
    evalLink.classList.add("btn-bloqueado");
  }
  const pie = document.getElementById("pieModulo");

  function moduleCompleto() {
    return A.moduloCompleto(U.correo, mod.numero, totalSecciones);
  }

  function siguienteIndice() {
    for (let i = 0; i < totalSecciones; i++) if (!hechas.has(i)) return i;
    return -1;
  }

  function aplicarEstado() {
    const completo = moduleCompleto();
    const sig = siguienteIndice();

    A.$$(".contenido-seccion").forEach(function (el) {
      const i = Number(el.dataset.seccion);
      const visible = hechas.has(i) || i === sig;
      el.classList.toggle("seccion-oculta", !visible);
      el.classList.toggle("seccion-actual", i === sig);

      const marca = el.querySelector(".sec-pie");
      if (marca) marca.remove();
      if (hechas.has(i)) {
        el.insertAdjacentHTML("beforeend",
          '<div class="sec-pie sec-pie-hecha">'
          + '<span>✓ Sección ' + (i + 1) + ' realizada</span>'
          + '</div>');
      }
    });

    /* Navegador de secciones */
    const caja = document.getElementById("cajaSecciones");
    if (caja) {
      if (completo) {
        caja.innerHTML =
          '<div class="aviso aviso-ok"><strong>✓ Leíste las ' + totalSecciones + ' secciones de este módulo</strong>'
          + 'Ahora puedes presentar la evaluación del protocolo.</div>';
      } else {
        caja.innerHTML = 'Sección ' + (sig + 1) + ' de ' + totalSecciones
          + ' · ' + hechas.size + ' realizadas';
      }
    }

    /* Botón principal: "Siguiente sección" o ir a la evaluación. */
    const pie = document.getElementById("pieModulo");
    if (!pie) return;
    const faltan = A.estadoModulos(U.correo, protocoloModulo ? protocoloModulo.id : "");

    if (completo) {
      pie.innerHTML = protocoloModulo
        ? '<a class="btn btn-azul" href="evaluacion.html?p=' + encodeURIComponent(protocoloModulo.id)
        + '">Ir a la evaluación →</a>'
        + '<a class="btn btn-borde" href="protocolos.html">Volver a los protocolos</a>'
        : '<a class="btn btn-azul" href="protocolos.html">Ir a los protocolos →</a>';
    } else {
      const pendientes = faltan.filter(function (m) { return m.numero !== mod.numero && !m.completo; });
      pie.innerHTML =
        '<button type="button" class="btn btn-azul" id="btnSiguienteSeccion">Siguiente sección →</button>'
        + '<button type="button" class="btn btn-borde" id="btnMarcarLeido">Marcar sección como realizada</button>'
        + (siguiente
          ? '<a class="btn btn-borde" href="modulo.html?n='
            + (todos[siguiente] ? todos[siguiente].numero : mod.numero) + sufijoP
            + '">Ir al módulo ' + (todos[siguiente] ? todos[siguiente].numero : mod.numero) + ' →</a>'
          : "")
        + (pendientes.length
          ? '<span class="pie-pendiente">Te falta leer ' + pendientes.length
            + ' módulo' + (pendientes.length === 1 ? "" : "s") + ' más de este protocolo.</span>'
          : '<span class="pie-pendiente">Este es el último módulo pendiente del protocolo.</span>');
    }
    conectarPie();
  }

  function conectarPie() {
    const btnSig = document.getElementById("btnSiguienteSeccion");
    if (btnSig) {
      btnSig.addEventListener("click", function () {
        const sig = siguienteIndice();
        if (sig < 0) return;
        A.marcarSeccionLeida(U.correo, mod.numero, sig);
        hechas.add(sig);
        aplicarEstado();
        A.aviso("Sección " + (sig + 1) + " marcada como realizada ✓", "ok");
        if (siguienteIndice() >= 0) {
          const el = document.getElementById("sec_" + siguienteIndice());
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          A.marcarModuloLeido(U.correo, mod.numero);
        }
      });
    }

    const btnHecho = document.getElementById("btnMarcarLeido");
    if (btnHecho) {
      btnHecho.addEventListener("click", function () {
        const sig = siguienteIndice();
        if (sig < 0) return;
        A.marcarSeccionLeida(U.correo, mod.numero, sig);
        hechas.add(sig);
        aplicarEstado();
      });
    }

    const evalBtn = pie.querySelector('a[href^="evaluacion.html"]');
    if (evalBtn) {
      evalBtn.addEventListener("click", function (ev) {
        if (!A.evaluacionHabilitada(U.correo, protocoloModulo.id)) {
          ev.preventDefault();
          A.aviso("Primero termina de leer todas las secciones de los módulos del protocolo.", "error");
        }
      });
    }
  }

  aplicarEstado();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo · ESE Municipal × Unillanos</title>
<link rel="icon" href="assets/logos/eselogo.jpg">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

<header class="encabezado" id="encabezado"></header>

<main class="envoltura">
  <div id="contenidoModulo">Cargando módulo…</div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/contenido.js"></script>
<script src="assets/js/preguntas.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  const A = window.App;
  const U = A.exigirRegistro();
  if (!U) return;

  const C = window.CONFIG;
  const cont = document.getElementById("contenidoModulo");

  const params = new URLSearchParams(location.search);
  const n = parseInt(params.get("n") || "1", 10);
  const mod = window.ContenidoCurso.porNumero(n);

  if (!mod) {
    cont.innerHTML = '<div class="tarjeta"><div class="vacio"><span class="icono">🔍</span>Módulo no encontrado. <a href="protocolos.html">Volver a los protocolos</a></div></div>';
    return;
  }

  /* ---- protocolo al que pertenece este módulo ---- */
  const protocoloModulo = A.protocolo(mod.protocolo || params.get("p") || "");
  if (protocoloModulo) sessionStorage.setItem("ese_protocolo", protocoloModulo.id);

  document.title = `Módulo ${mod.numero} · ${mod.titulo} | ESE Municipal × Unillanos`;

  /* ---- navegación anterior / siguiente dentro del mismo protocolo ---- */
  const todos = (window.CURSO.modulos || [])
    .filter(m => !protocoloModulo || (protocoloModulo.modulos || []).includes(m.numero))
    .slice()
    .sort((a, b) => a.numero - b.numero);
  const idx = todos.findIndex(m => m.numero === mod.numero);
  const anterior = idx > 0 ? todos[idx - 1] : null;
  const siguiente = idx < todos.length - 1 ? todos[idx + 1] : null;
  const sufijoP = protocoloModulo ? "&p=" + encodeURIComponent(protocoloModulo.id) : "";

  /* ---- render de secciones ---- */
  function avisoHtml(a) {
    if (!a) return "";
    const iconos = { clave: "🔑", dato: "📌", alerta: "⚠️", excepcion: "⚡" };
    return `<div class="aviso-${a.tipo}">
      <strong>${iconos[a.tipo] || "•"} ${A.esc(a.titulo)}</strong>${A.esc(a.texto)}
    </div>`;
  }

  function tablaHtml(t) {
    if (!t) return "";
    return `<div class="tabla-envoltura"><table class="datos">
      <thead><tr>${t.columnas.map(c => `<th>${A.esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${t.filas.map(f => `<tr>${f.map(c => `<td>${A.esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  function listaHtml(items) {
    return `<ul>${items.map(i => `<li>${A.esc(i)}</li>`).join("")}</ul>`;
  }

  function columnasHtml(cols) {
    return `<div class="columnas">${cols.map(c => `
      <div class="columna-caja">
        <h4>${A.esc(c.titulo)}</h4>
        ${listaHtml(c.items)}
      </div>`).join("")}</div>`;
  }

  const seccionesHtml = mod.secciones.map(s => {
    let h = `<section class="contenido-seccion">`;
    // Algunas secciones solo llevan cita o nota: no se dibuja un título vacío.
    if (s.titulo) h += `<h2>${A.esc(s.titulo)}</h2>`;
    if (s.subtituloRelacion) h += `<h3>${A.esc(s.subtituloRelacion)}</h3>`;
    if (s.cita) h += `<div class="cita">${A.esc(s.cita)}</div>`;
    if (s.parrafos) h += s.parrafos.map(p => `<p>${A.esc(p)}</p>`).join("");
    if (s.lista) h += listaHtml(s.lista);
    h += tablaHtml(s.tabla);
    if (s.columnas) h += columnasHtml(s.columnas);
    h += avisoHtml(s.aviso);
    if (s.nota) h += `<div class="nota">${A.esc(s.nota)}</div>`;
    h += `</section>`;
    return h;
  }).join("");

  /* ---- tema y procedimiento asociado ---- */
  const tema = window.BancoPreguntas ? window.TEMAS.find(t => t.id === mod.temaId) : null;
  const totalProtocolo = A.totalPreguntasProtocolo(protocoloModulo ? protocoloModulo.id : "");

  cont.innerHTML = `
    <section class="leedor-cabecera">
      ${protocoloModulo ? `
      <a class="miga" href="protocolos.html">← Protocolos</a>
      <div class="pt-barra" style="--color-protocolo:${protocoloModulo.color}">
        ${protocoloModulo.icono} Protocolo ${protocoloModulo.numero}: ${A.esc(protocoloModulo.nombre)}
        ${protocoloModulo.pdf
          ? `<a class="pt-pdf-inline" href="${A.esc(protocoloModulo.pdf)}" target="_blank" rel="noopener">📄 Ver el procedimiento (PDF) — si quieres consultarlo</a>`
          : ""}
      </div>` : ""}
      <div class="fila-top">
        <span class="etiqueta">Módulo ${mod.numero} de ${window.CURSO.modulos.length}</span>
        ${mod.icono ? `<span style="font-size:1.4rem">${A.esc(mod.icono)}</span>` : ""}
      </div>
      <h1>${A.esc(mod.titulo)}</h1>
      ${mod.subtitulo ? `<p class="texto-suave" style="margin:0">${A.esc(mod.subtitulo)}</p>` : ""}
      ${mod.fuente ? `<p class="fuente">Fuente: ${A.esc(mod.fuente)}</p>` : ""}
    </section>

    <div class="tarjeta">
      ${seccionesHtml}

      ${tema ? `
      <div class="aviso aviso-clave mt-2">
        <strong>Este módulo se evalúa en el tema "${A.esc(tema.titulo)}"</strong>
        En la evaluación de este protocolo encontrarás ${totalProtocolo} preguntas que cubren este contenido.
      </div>` : ""}

      <div class="navegacion-modulos">
        ${anterior
          ? `<a class="btn btn-borde" href="modulo.html?n=${anterior.numero}${sufijoP}">← ${A.esc(anterior.titulo)}</a>`
          : `<a class="btn btn-borde" href="protocolos.html">← Volver a los protocolos</a>`}
        ${siguiente
          ? `<a class="btn" href="modulo.html?n=${siguiente.numero}${sufijoP}">${A.esc(siguiente.titulo)} →</a>`
          : (protocoloModulo
              ? `<a class="btn btn-azul" href="evaluacion.html?p=${encodeURIComponent(protocoloModulo.id)}">Ir a la evaluación →</a>`
              : `<a class="btn btn-azul" href="protocolos.html">Ir a los protocolos →</a>`)}
      </div>
    </div>

    <div class="acciones-resultado">
      <button type="button" class="btn btn-azul" id="btnMarcarLeido">Marcar módulo como leído</button>
      ${protocoloModulo
        ? `<a class="btn btn-borde" href="evaluacion.html?p=${encodeURIComponent(protocoloModulo.id)}">Evaluar este protocolo</a>`
        : ""}
      <a class="btn btn-borde" href="protocolos.html">Volver a los protocolos</a>
    </div>`;

  /* Marcar como leído: avisa con una pestaña y no interrumpe la lectura. */
  const btnLeido = document.getElementById("btnMarcarLeido");

  function reflejarLeido() {
    if (!A.modulosLeidos(U.correo).includes(mod.numero)) return;
    btnLeido.disabled = true;
    btnLeido.textContent = "✓ Módulo leído";
    btnLeido.classList.add("btn-ok");
  }

  btnLeido.addEventListener("click", () => {
    A.marcarModuloLeido(U.correo, mod.numero);
    reflejarLeido();
    A.aviso(`Módulo ${mod.numero} marcado como leído ✓`, "ok");
  });

  reflejarLeido();
})();
</script>
</body>
</html>
